name: Build Hermes packages

on:
  workflow_dispatch:

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: compiler-linux-x64
            runner: ubuntu-24.04
          - target: compiler-macos-arm64
            runner: macos-26
          - target: runtime-macos-arm64
            runner: macos-26
          - target: runtime-ios-arm64
            runner: macos-26
          - target: runtime-android-arm64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev ninja-build

      - name: Configure Android NDK
        if: matrix.target == 'runtime-android-arm64'
        shell: bash
        run: |
          set -euo pipefail
          source config/hermes.env
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_home/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -d "$android_home/ndk/$ANDROID_NDK_VERSION" ]]; then
            (yes || true) | "$sdkmanager" --licenses >/dev/null
            (yes || true) | "$sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          fi
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$android_home/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Prepare source
        shell: bash
        run: bash scripts/prepare_source.sh

      - name: Build and package
        shell: bash
        run: bash scripts/build_package.sh "${{ matrix.target }}"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: work/package/${{ matrix.target }}
          compression-level: 0
          retention-days: 7
